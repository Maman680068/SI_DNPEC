name: Migration base de données (manuel)

# Déclenchement manuel uniquement (workflow_dispatch) — aucune exécution
# automatique sur push/PR. La DATABASE_URL est lue depuis le secret de dépôt
# `DATABASE_URL` (jamais écrite ici) : voir apps/api/.env.example pour le
# format attendu.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "migrate" pour confirmer (applique prisma migrate deploy + le seed des cellules sur la base pointée par le secret DATABASE_URL)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @dnpec/api exec prisma generate

      - name: Appliquer les migrations (prisma migrate deploy)
        run: pnpm --filter @dnpec/api exec prisma migrate deploy

      - name: Peupler les données de référence (cellules CTSCM/CNC/SAF/RH/CSID)
        run: pnpm --filter @dnpec/api run db:seed
