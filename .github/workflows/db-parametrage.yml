name: Paramétrage initial (manuel)

# Déclenchement manuel uniquement. Crée le paramétrage initial manquant
# (registres du courrier, catégories logistiques, capacités d'accueil, modèle
# d'attestation, ressources réservables, articles) sur la base pointée par le
# secret DATABASE_URL — voir apps/api/prisma/parametrage.ts.
# CRÉATION SEULEMENT : rien d'existant n'est modifié ni supprimé, et un
# élément supprimé à l'écran n'est jamais recréé. Refuse de tourner si les
# migrations ne sont pas à jour (lancer d'abord db-migrate.yml).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "parametrer" pour confirmer (crée seulement ce qui manque, ne modifie rien)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  parametrer:
    if: ${{ github.event.inputs.confirm == 'parametrer' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @dnpec/api exec prisma generate

      - name: Paramétrage initial (liste de ce qui est créé et de ce qui existait déjà)
        run: pnpm --filter @dnpec/api run db:parametrage
