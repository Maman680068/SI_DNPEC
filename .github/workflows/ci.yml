name: CI — suite de bout en bout

# Sur chaque pull request (et à la demande) : base PostgreSQL JETABLE créée par
# le runner, migrations appliquées sur base vide, build de l'API et du web,
# suite complète (API + Chromium). N'utilise AUCUN secret et ne touche JAMAIS la
# production : DATABASE_URL est écrite ici en clair et pointe sur localhost, et
# tests/e2e/scripts/garde-locale.sh refuse toute autre adresse.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnpec
          POSTGRES_PASSWORD: dnpec
          POSTGRES_DB: dnpec_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnpec -d dnpec_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dnpec:dnpec@localhost:5432/dnpec_ci?schema=public
      JWT_ACCESS_SECRET: secret-de-test-ci-sans-valeur
      WEB_PROXY_SECRET: secret-proxy-ci-sans-valeur
      JWT_ACCESS_EXPIRES_IN: 2h
      WEB_APP_URL: http://localhost:3100
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
      TZ: UTC
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Outils des tests (python-docx, service de calcul, Chromium, client PostgreSQL)
        run: |
          pip install python-docx
          pip install -r apps/calcul/requirements-ci.txt
          pnpm --filter @dnpec/e2e exec playwright install --with-deps chromium
          sudo apt-get install -y postgresql-client lsof >/dev/null

      - name: Service de calcul — tests (paquet factice en Python pur)
        working-directory: apps/calcul
        run: python3 -m pytest -q

      - name: Vérification des types (API et web)
        run: |
          pnpm --filter @dnpec/api exec prisma generate
          pnpm --filter @dnpec/api typecheck
          pnpm --filter @dnpec/web typecheck

      - name: Suite complète (base vide, migrations, build, API + Chromium)
        run: bash tests/e2e/run_all.sh

      - name: Résultats (résumé, journaux, captures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-e2e
          path: |
            tests/e2e/out/resume.txt
            tests/e2e/out/logs/
            tests/e2e/out/shots/
          retention-days: 14

  # Lot B1 : image Docker du service de calcul (IPOPT, pyomo) construite et essayée telle que Render la
  # construira : sonde /sante, solveur présent, vérification du paquet factice avec le secret partagé.
  calcul-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Construire l'image dnpec-calcul
        run: docker build -t dnpec-calcul apps/calcul

      - name: Essai du conteneur (sonde, IPOPT, vérification d'un paquet)
        run: |
          docker run -d --name calcul -p 8000:8000 -e CALCUL_SECRET=secret-ci-calcul-0123456789 dnpec-calcul
          for i in $(seq 1 30); do curl -sf localhost:8000/sante && break; sleep 2; done
          curl -sf localhost:8000/sante | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['statut']=='ok' and d['solveurs']['ipopt'], d"
          python3 apps/calcul/exemples/construire_paquet.py apps/calcul/exemples/paquet_factice /tmp/p.zip
          test "$(curl -s -o /dev/null -w '%{http_code}' -F paquet=@/tmp/p.zip localhost:8000/paquets/verifier)" = 401
          curl -sf -H 'X-Calcul-Secret: secret-ci-calcul-0123456789' -F paquet=@/tmp/p.zip localhost:8000/paquets/verifier \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['statut']=='ok' and len(d['controles'])==4, d"
          docker exec calcul python -c "import pyomo.environ as pyo; from pyomo.contrib.pynumero.asl import AmplInterface; assert AmplInterface.available(); m=pyo.ConcreteModel(); m.x=pyo.Var(initialize=1.0); m.c=pyo.Constraint(expr=m.x**2==4); m.o=pyo.Objective(expr=0); r=pyo.SolverFactory('cyipopt').solve(m); assert abs(pyo.value(m.x)-2)<1e-6, pyo.value(m.x); print('IPOPT (cyipopt) : solution', pyo.value(m.x))"
          docker logs calcul | tail -5
