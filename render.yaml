# Blueprint Render pour l'API NestJS (apps/api) et le frontend Next.js
# (apps/web) — voir docs/deploiement-render.md pour la checklist complète des
# étapes manuelles (création des secrets, compte Brevo...). Ce fichier ne
# contient AUCUN secret : les valeurs marquées `sync: false` sont saisies une
# seule fois dans le tableau de bord Render lors de l'application du
# Blueprint, jamais commises ici.
#
# Les migrations Prisma restent volontairement EXCLUES du build/start ci-dessous
# — comportement inchangé : elles continuent de s'appliquer uniquement via le
# workflow GitHub Actions à déclenchement manuel (.github/workflows/db-migrate.yml).
#
# Pas de champ `branch:` ici, volontairement : Render déploie alors depuis la
# branche depuis laquelle le Blueprint est appliqué (voir docs/deploiement-render.md).
# Le fixer en dur ferait diverger le déploiement dès que le travail avance sur
# une autre branche que celle codée ici.

services:
  - type: web
    name: dnpec-api
    runtime: node
    plan: starter # le plan gratuit ne permet pas d'attacher un disque persistant
    region: frankfurt # même région que la base PostgreSQL déjà provisionnée
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @dnpec/api exec prisma generate && pnpm --filter @dnpec/api run build
    startCommand: pnpm --filter @dnpec/api run start:prod
    healthCheckPath: /health
    disk:
      name: dnpec-documents
      mountPath: /var/data/documents
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Base de données PostgreSQL déjà provisionnée sur Render — connection
      # string complète (postgresql://user:password@host/db), jamais en dur.
      - key: DATABASE_URL
        sync: false
      # Générée automatiquement par Render au moment de l'application du
      # Blueprint — jamais saisie ni commise nulle part.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      # Stockage des documents GED — pointé sur le disque persistant déclaré
      # ci-dessus (voir StorageService, apps/api/src/common/storage/).
      - key: DOCUMENTS_STORAGE_PATH
        value: /var/data/documents
      # SMTP réel (Brevo ou équivalent) — voir docs/deploiement-render.md pour
      # la procédure de création du compte et de récupération des identifiants.
      # Tant que SMTP_HOST est vide, EmailService retombe sur jsonTransport
      # (aucun envoi réel) : voir son commentaire.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "no-reply@dnpec.gov.gn"
      # Quota journalier d'emails de l'offre Brevo (300 pour l'offre gratuite) : la supervision
      # alerte à 80 %. À ajuster si l'offre Brevo change.
      - key: BREVO_QUOTA_JOUR
        value: "300"
      # Origines autorisées en CORS, séparées par des virgules : l'URL exacte
      # du web (ex. https://dnpec-web.onrender.com). Sans valeur, toute origine
      # est autorisée. Une origine refusée est journalisée (« Origine refusée »)
      # et donne « Le serveur de l'application ne répond pas » dans le
      # navigateur : voir docs/deploiement-render.md, § 6.
      - key: CORS_ORIGIN
        sync: false
      # URL du frontend déployé — construit le lien envoyé par email pour la
      # réinitialisation de mot de passe (voir auth.service.ts, forgotPassword).
      # Même valeur que celle utilisée pour dnpec-web ci-dessous.
      - key: WEB_APP_URL
        value: https://dnpec-web.onrender.com
      # Secret partagé avec dnpec-web (MÊME valeur, 16 caractères au moins) : l'API ne croit
      # l'adresse IP transmise par le web pour une connexion que s'il l'accompagne (revue de
      # sécurité 2026-10, apps/api/src/common/security/client-ip.ts). Sans lui, le verrouillage
      # par adresse IP des connexions est désactivé (le verrouillage par compte reste actif).
      - key: WEB_PROXY_SECRET
        sync: false

  - type: web
    name: dnpec-web
    runtime: node
    plan: free # pas de disque ni de calcul lourd ici ; à passer en starter si
    # le temps de réveil du plan gratuit (jusqu'à ~50s après 15 min d'inactivité)
    # n'est pas acceptable pour les utilisateurs.
    region: frankfurt # même région que dnpec-api, pour les appels serveur→serveur
    # des Route Handlers (app/api/auth/*) vers l'API.
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @dnpec/web run build
    startCommand: pnpm --filter @dnpec/web run start
    healthCheckPath: / # testé en local en mode production : la page racine
    # (app/page.tsx) est un composant client qui ne rend rien côté serveur et
    # ne dépend pas de l'API — répond 200 même si l'API est indisponible.
    envVars:
      - key: NODE_ENV
        value: production
      # URL de l'API déployée — voir apps/web/.env.example pour l'usage exact
      # de chaque variable (API_BASE_URL : lue côté serveur par les Route
      # Handlers ; NEXT_PUBLIC_API_BASE_URL : injectée dans le bundle client
      # au moment du build, doit donc être présente ici et pas seulement au
      # runtime).
      - key: API_BASE_URL
        value: https://dnpec-api.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://dnpec-api.onrender.com
      # Même valeur que WEB_PROXY_SECRET de dnpec-api (voir ci-dessus).
      - key: WEB_PROXY_SECRET
        sync: false
